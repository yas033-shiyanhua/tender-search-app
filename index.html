<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Search — Prototype (Phase 1)</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f4f6f8;color:#1c2733;line-height:1.5}
  header{background:#123a5c;color:#fff;padding:20px 18px}
  header h1{margin:0;font-size:22px}
  header p{margin:6px 0 0;opacity:.9}
  .langtoggle{margin-top:12px}
  .langtoggle button{border:1px solid #fff;background:transparent;color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:14px;margin-right:6px}
  .langtoggle button.active{background:#fff;color:#123a5c;font-weight:700}
  .wrap{max-width:960px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid #dbe3ea;border-radius:10px;padding:16px;margin:14px 0}
  h2{margin:0 0 8px;font-size:19px}
  h3{margin:14px 0 6px;font-size:16px}
  .muted{color:#5a6b7a;font-size:13px}
  .disclaimer{background:#fff7d6;border:1px solid #e8c95a;border-radius:8px;padding:10px 12px;font-size:13px;margin:14px 0}
  .btn{border:1px solid #123a5c;background:#fff;color:#123a5c;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px;margin:4px 6px 4px 0}
  .btn.primary{background:#123a5c;color:#fff}
  .btn:hover{opacity:.85}
  label.opt{display:block;padding:8px 10px;border:1px solid #dbe3ea;border-radius:8px;margin:6px 0;cursor:pointer}
  label.opt input{margin-right:8px}
  select,input[type=text]{padding:8px;border:1px solid #c4d0dc;border-radius:8px;font-size:15px}
  .qual{display:flex;gap:10px;align-items:flex-start;border:1px solid #dbe3ea;border-radius:8px;padding:10px;margin:8px 0}
  .qual input{margin-top:4px;transform:scale(1.3)}
  .qual b{font-size:15px}
  .qbtn{border:1px solid #888;background:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;font-weight:bold;flex:none}
  .qpanel{display:none;background:#f0f6fb;border-left:4px solid #2a7ab8;padding:10px 12px;margin:8px 0 4px;font-size:14px}
  .qpanel.open{display:block}
  .pool-big{font-size:42px;font-weight:800;color:#123a5c;line-height:1}
  .bar{height:14px;background:#e3e9ef;border-radius:7px;overflow:hidden;margin:10px 0}
  .bar>div{height:100%;background:#2a7ab8}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{border-bottom:1px solid #e3e9ef;padding:8px 6px;text-align:left;vertical-align:top}
  th{background:#f0f3f6}
  .ok{color:#0a7a3d;font-weight:700}
  .miss{color:#b3261e;font-weight:700}
  .tender{border:1px solid #dbe3ea;border-left:5px solid #2a7ab8;border-radius:8px;padding:12px;margin:10px 0;cursor:pointer}
  .tender .tdetail{display:none;margin-top:8px}
  .tender.open .tdetail{display:block}
  .tender .due{font-size:13px;color:#5a6b7a;margin-top:2px}
  .tender.near{border-left-color:#e8a13a}
  .tender.closed{border-left-color:#999;opacity:.75}
  .tag{display:inline-block;background:#eef3f7;border-radius:20px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0}
  .pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700}
  .pill.el{background:#dff2e4;color:#0a5c2a}
  .pill.near{background:#fdeecb;color:#7a5200}
  .pill.hide{background:#f2d7d5;color:#7a1a16}
  .gain{font-weight:700;color:#0a5c2a}
  .bubbles{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0}
  .section-btn{display:block;width:100%;text-align:left;background:#eef3f7;border:2px solid #123a5c;border-radius:10px;padding:12px 14px;margin:16px 0 8px;font-size:18px;font-weight:700;color:#123a5c;cursor:pointer}
  .bubble{width:110px;height:110px;border-radius:50%;background:#2a7ab8;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;border:none;font-size:15px;animation:float 3.5s ease-in-out infinite;box-shadow:0 4px 12px rgba(18,58,92,.25)}
  .bubble.grey{background:#c9d1d8;color:#3a4650;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  .bubble b{font-size:26px;line-height:1}
  .bubble span{font-size:12px;padding:0 8px}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .bubble-detail{display:none;background:#f0f6fb;border-left:4px solid #2a7ab8;padding:12px;margin:8px 0;font-size:14px}
  .bubble-detail.open{display:block}
</style>
</head>
<body>
<header>
  <h1 id="hdrTitle"></h1>
  <p id="hdrSub"></p>
  <div class="langtoggle">
    <button id="lang-en" class="active" onclick="setLang('en')">EN</button>
    <button id="lang-zh" onclick="setLang('zh')">中文</button>
  </div>
</header>
<div class="wrap">

<div class="disclaimer" id="disclaimer"></div>

<div class="card">
  <h2 id="tryTitle"></h2>
  <p class="muted" id="trySub"></p>
  <button class="btn primary" id="btn-us" onclick="preset('us')"></button>
  <button class="btn" id="btn-china" onclick="preset('china')"></button>
  <button class="btn" id="btn-none" onclick="preset('none')"></button>
  <p id="presetNote" class="muted"></p>
</div>

<div class="card" id="step0">
  <h2 id="step0Title"></h2>
  <h3 id="usStatusTitle"></h3>
  <label class="opt"><input type="radio" name="status" value="citizen" checked onchange="render()"> <span id="stCitizen"></span></label>
  <label class="opt"><input type="radio" name="status" value="greencard" onchange="render()"> <span id="stGreen"></span></label>
  <label class="opt"><input type="radio" name="status" value="other" onchange="render()"> <span id="stOther"></span></label>
  <div id="countryRow" style="display:none;margin:8px 0">
    <label><span id="countryLabel"></span>
      <select id="country" onchange="render()"></select>
    </label>
    <p class="muted" id="countryNote"></p>
  </div>

  <h3 id="uscoTitle"></h3>
  <p class="muted" id="uscoNote"></p>
  <label class="opt"><input type="radio" name="usco" value="yes" onchange="setUsCompany(true)"> <span id="uscoYes"></span></label>
  <label class="opt"><input type="radio" name="usco" value="no" checked onchange="setUsCompany(false)"> <span id="uscoNo"></span></label>
  <div id="uscoHelp" class="qpanel"></div>
  <button class="btn" id="uscoHelpBtn" onclick="document.getElementById('uscoHelp').classList.toggle('open')"></button>
</div>

<div class="card" id="step1">
  <h2 id="step1Title"></h2>
  <p class="muted" id="step1Sub"></p>
  <div id="quals"></div>
</div>

<div class="card" id="pool">
  <h2 id="poolTitle"></h2>
  <div class="bubbles" id="bubbles"></div>
  <div id="bubbleDetail" class="bubble-detail"></div>
  <p class="muted" id="poolHint"></p>
  <div id="poolDetails" style="display:none">
  <div id="poolMain"></div>
  <div id="poolGains"></div>
  <h3 id="poolTableTitle"></h3>
  <table>
    <thead><tr><th id="thQual"></th><th id="thHave"></th><th id="thPoolIf"></th><th id="thGain"></th></tr></thead>
    <tbody id="poolTable"></tbody>
  </table>
  <p class="muted" id="poolNote"></p>
  </div>
</div>

<div class="card" id="results">
  <h2 id="resultsTitle"></h2>
  <div id="eligible"></div>
  <button class="section-btn" id="nearTitle" onclick="toggleSection('near')"></button>
  <div id="near" style="display:none"></div>
  <button class="section-btn" id="hiddenTitle" onclick="toggleSection('hidden')"></button>
  <div id="hidden" style="display:none"></div>
  <button class="section-btn" id="closedTitle" onclick="toggleSection('closed')"></button>
  <div id="closed" style="display:none"></div>
</div>

<div class="card">
  <h2 id="feedbackTitle"></h2>
  <p id="feedbackBody"></p>
  <p class="muted" id="footerNote"></p>
</div>

</div>
<script>
let lang='en';
const I18N={
en:{
 hdrTitle:'Tender Search — Phase 1 Prototype',
 hdrSub:'Tick what you are legally qualified to do → see only the tenders you can bid on → see how big your pool is.',
 disclaimer:'<b>For reference only — not legal, tax, or financial advice.</b> Qualification rules, tariff and tax rates change, and every tender has its own terms. Check the official source and the solicitation itself before you bid. We are not liable for decisions made from this information.',
 tryTitle:'Try it quickly', trySub:'Presets fill in Step 0 + Step 1 for you. You can change any tick afterwards.',
 presetUs:'US small factory — has US company, EIN, SAM.gov',
 presetChina:'Foreign factory — no US company',
 presetReset:'Reset — nothing ticked',
 presetNoteDefault:'Prototype data as of 2026-11-21. 7 active tenders in the pool. DLA flags (due 2026-11-20) is shown as closed.',
 step0Title:'Step 0 — Who are you? (ask this first)',
 usStatusTitle:'1. US status',
 citizen:'US citizen', greencard:'Green-card holder', other:'Other',
 countryLabel:'Which country are you / is your company in?',
 countryNote:'Rules are not the same for every foreigner. China / India are not WTO GPA designated countries. Taiwan, Japan, South Korea, Canada, UK, EU, Australia, Singapore are GPA parties — they may be eligible on covered federal tenders above the GPA threshold, subject to that tender\u2019s own terms. Berry tenders still need 100% US-made, for everyone.',
 uscoTitle:'2. Do you hold a US company?',
 uscoNote:'This is Step 1 in the qualification list — asked here first, because without it most US tenders are not open to you. It is kept in sync with item 1 below.',
 uscoYes:'Yes — I hold a US company (LLC / Corp)',
 uscoNo:'No — I do not hold a US company',
 uscoHelp:'<div style="font-weight:800;font-size:15px;margin-bottom:2px">🗺️ US company roadmap — 5 steps, 2–3 weeks total</div><div style="font-size:12px;color:#666;margin-bottom:8px">Tap the ? on any step for details. Pick the state by your business size — cheap states are not right for everyone.</div><div style="display:flex;gap:6px;margin:6px 0 8px"><div style="flex:1;background:#C8F7DC;border:2px solid #22B573;border-radius:12px;padding:8px 10px"><div style="font-size:11px;color:#0a7a3d;font-weight:800">💰 AS LOW AS <details style="display:inline"><summary style="display:inline;cursor:pointer">❓</summary><div style="font-size:12px;font-weight:400;color:#333;margin-top:4px"><div>⚠️ $50 is the state filing fee ONLY — not the total. The total is ~$149 because a registered agent ($99/yr) is also required. See the yellow total box below.<br>New Mexico LLC — $50 filing, then $0/yr after. <details style="display:inline"><summary style="display:inline;cursor:pointer">❓</summary><div style="margin-top:4px">Cheapest option. Best if you just want the lowest cost and run a small business on your own — $50 once, then $0 every year after.</div></details></div><div style="margin-top:6px">Wyoming LLC — $100 filing + $60/yr. <details style="display:inline"><summary style="display:inline;cursor:pointer">❓</summary><div style="margin-top:4px">Why pay the extra $60/yr? Three things:<br>1. Strongest asset protection: Wyoming has some of the strongest LLC protection in the US — if someone sues you, a court can usually only take your distributions, not the company assets directly. Single-member LLCs are protected too; New Mexico is weaker here.<br>2. Reputation: Wyoming invented the LLC in the US, so banks, investors and partners trust it. New Mexico is cheaper but less known, and some banks ask more questions.<br>3. No state income tax: Wyoming has none. New Mexico LLCs pass through, but personal income tax is 1.5%–5.9%, which matters when you earn more.<br>Rule of thumb: cheapest / small on your own → New Mexico is enough. Protect assets / grow big / raise money → pay the extra $60/yr for Wyoming.</div></details></div></div></details></div><div style="font-weight:800;font-size:22px">$149</div><div style="font-size:11px;color:#0a7a3d">total, Year 1 — filing $50 + agent $99</div></div><div style="flex:1;background:#FFE0B2;border:2px solid #FF8A00;border-radius:12px;padding:8px 10px"><div style="font-size:11px;color:#b25e00;font-weight:800">⚡ AS FAST AS <details style="display:inline"><summary style="display:inline;cursor:pointer">❓</summary><div style="font-size:12px;font-weight:400;color:#333;margin-top:4px">Wyoming online filing active same day. EIN by phone during the call. Whole set-up 2–3 weeks.</div></details></div><div style="font-weight:800;font-size:22px">Same day</div></div></div><div style="background:#FFF3B0;border:2px solid #FFC400;border-radius:12px;padding:8px 10px;margin-bottom:8px"><b>🧮 Cheapest total — Year 1: ~$149 · Year 2: ~$99/yr</b> <details style="display:inline"><summary style="display:inline;cursor:pointer;font-weight:800">❓</summary><div style="font-size:12px;margin-top:6px"><div style="font-weight:800">New Mexico (cheapest)</div><table style="width:100%;font-size:12px;border-collapse:collapse"><tr><td style="padding:2px 6px 2px 0;white-space:nowrap">Year 1</td><td style="padding:2px 0">$50 filing + $99 agent + EIN $0 + bank $0 = <b>~$149</b></td></tr><tr><td style="padding:2px 6px 2px 0;white-space:nowrap">Year 2</td><td style="padding:2px 0">$0 annual report + $99 agent = <b>~$99/yr</b></td></tr><tr><td style="padding:2px 6px 2px 0;white-space:nowrap">Mailbox <details style="display:inline"><summary style="display:inline;cursor:pointer">❓</summary><div style="font-weight:400;margin-top:4px;font-size:11px;white-space:normal">Optional, not required. Buy it only for convenience: mail gets scanned so you can read it online without waiting for the agent to forward it; business mail stays separate from legal mail; and you get a separate mailing address. Without it, mail goes to the agent address, which is enough to register and bid.</div></details></td><td style="padding:2px 0">+$60/yr → Year 1 ~$209 · Year 2 ~$159</td></tr></table><div style="font-size:11px;color:#555">New Mexico only: the agent address is the business address, no separate mailbox needed.</div><div style="font-weight:800;margin-top:8px">Wyoming</div><table style="width:100%;font-size:12px;border-collapse:collapse"><tr><td style="padding:2px 6px 2px 0;white-space:nowrap">Year 1</td><td style="padding:2px 0">$100 filing + $60 report + $50 to $99 agent = <b>$210 to $259</b></td></tr><tr><td style="padding:2px 6px 2px 0;white-space:nowrap">Year 2</td><td style="padding:2px 0">$60 report + $50 to $99 agent = <b>~$110 to $159/yr</b></td></tr><tr><td style="padding:2px 6px 2px 0;white-space:nowrap">Mailbox <details style="display:inline"><summary style="display:inline;cursor:pointer">❓</summary><div style="font-weight:400;margin-top:4px;font-size:11px;white-space:normal">Optional, not required. Buy it only for convenience: mail gets scanned so you can read it online without waiting for the agent to forward it; business mail stays separate from legal mail; and you get a separate mailing address. Without it, mail goes to the agent address, which is enough to register and bid.</div></details></td><td style="padding:2px 0">extra, not included</td></tr></table><div style="font-size:11px;color:#555">Wyoming too: the agent address is the business address, no separate mailbox needed.</div></div></details></div><div style="display:flex;flex-direction:column;gap:6px"><div style="background:#FFF3B0;border-left:5px solid #FFC400;border-radius:10px;padding:8px 10px"><b>STEP 1 · Pick a state by size</b> <details style="display:inline"><summary style="display:inline;cursor:pointer;font-weight:800">❓</summary><div style="margin-top:6px;font-size:12px"><table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th style="text-align:left;border-bottom:1px solid #999;padding:3px">Revenue / size</th><th style="text-align:left;border-bottom:1px solid #999;padding:3px">Register where</th><th style="text-align:left;border-bottom:1px solid #999;padding:3px">State tax</th></tr><tr><td style="padding:3px">Under ~$50k/yr, solo, just starting</td><td style="padding:3px"><b>Wyoming LLC</b> $100 + $60/yr, or <b>New Mexico LLC</b> $50 + $0/yr</td><td style="padding:3px">WY: no state income tax. NM: 5.9% corp / 1.5–5.9% personal, but LLC passes through.</td></tr><tr><td style="padding:3px">$50k–$250k/yr, operating in one state</td><td style="padding:3px"><b>Your home state</b> — otherwise you pay two states</td><td style="padding:3px">Varies. CA: $800/yr minimum + LLC fee $0 under $250k income.</td></tr><tr><td style="padding:3px">Profit over ~$60k/yr</td><td style="padding:3px">Ask a CPA about <b>S-Corp election</b> (Form 2553) — can save self-employment tax, but adds payroll + filings</td><td style="padding:3px">Federal: S-Corp itself pays no federal income tax; owners pay on distributions + salary.</td></tr><tr><td style="padding:3px">Raising money / investors, $1M+ ambition</td><td style="padding:3px"><b>Delaware C-Corp</b> $110 + $400/yr</td><td style="padding:3px">Federal corp tax 21%. DE: no state corp tax on income earned outside DE.</td></tr></table><div style="margin-top:4px">⚠️ <b>Nevada is NOT a cheap shortcut:</b> $425 to form + $350/yr. In California you also pay $800/yr anyway. Figures are state fees, not total tax — federal tax depends on profit and entity type. 🔗 <a href="https://wyobiz.wyo.gov/" target="_blank">Wyoming SOS — file online</a> · <a href="https://www.sos.nm.gov/business-services/" target="_blank">New Mexico SOS</a> · <a href="https://corp.delaware.gov/" target="_blank">Delaware Division of Corporations</a> · <a href="https://www.sos.ca.gov/business-programs/business-entities" target="_blank">California SOS</a> · <a href="https://www.irs.gov/businesses/small-businesses-self-employed/s-corporations" target="_blank">IRS: S-Corp</a></div></div></details></div><div style="background:#FFD6E8;border-left:5px solid #FF5C8A;border-radius:10px;padding:8px 10px"><b>STEP 2 · Name + registered agent</b> <details style="display:inline"><summary style="display:inline;cursor:pointer;font-weight:800">❓</summary><div style="margin-top:6px;font-size:12px">Check the name is free on the state Secretary of State business search (free, online). The agent must have a real street address in that state and be available during business hours to receive legal mail. Cost ~$50–$150/yr. Many formation services bundle the first year. You can change agents later. 🔗 <a href="https://wyobiz.wyo.gov/Business/FilingSearch.aspx" target="_blank">Wyoming — search a name</a></div></details></div><div style="background:#C8F7DC;border-left:5px solid #22B573;border-radius:10px;padding:8px 10px"><b>STEP 3 · File online</b> <details style="display:inline"><summary style="display:inline;cursor:pointer;font-weight:800">❓</summary><div style="margin-top:6px;font-size:12px">File Articles of Organization (LLC) or Certificate of Incorporation (Corp) on the Secretary of State website and pay by card. You need: company name, agent name + address, mailing address, organizer signature. Wyoming: active the <b>same day</b>. Delaware: 3–10 business days. You get a stamped certificate / filing receipt — keep it, the bank and IRS will ask for it. 🔗 <a href="https://wyobiz.wyo.gov/Business/RegistrationInstr.aspx" target="_blank">Wyoming — file Articles online</a> · <a href="https://corp.delaware.gov/" target="_blank">Delaware — file online</a></div></details></div><div style="background:#D6E4FF;border-left:5px solid #5B8DEF;border-radius:10px;padding:8px 10px"><b>STEP 4 · Get your EIN — free</b> <details style="display:inline"><summary style="display:inline;cursor:pointer;font-weight:800">❓</summary><div style="margin-top:6px;font-size:12px">IRS Form SS-4, no SSN needed. Phone +1 267-941-1099 (Mon–Fri, 6am–11pm ET): issued <b>during the call</b>. Fax: ~4 business days. Mail: ~4 weeks. The IRS never charges for an EIN — any site charging for it is selling a service, not the number. You need the EIN before the bank account and SAM.gov. 🔗 <a href="https://www.irs.gov/businesses/employer-identification-number" target="_blank">IRS — get an EIN (free)</a> · <a href="https://www.irs.gov/forms-pubs/about-form-ss-4" target="_blank">IRS — Form SS-4</a></div></details></div><div style="background:#FFE0B2;border-left:5px solid #FF8A00;border-radius:10px;padding:8px 10px"><b>STEP 5 · Address + bank account</b> <details style="display:inline"><summary style="display:inline;cursor:pointer;font-weight:800">❓</summary><div style="margin-top:6px;font-size:12px">Virtual mailbox with a real street address: Anytime Mailbox from $4.99/mo, iPostal1 from $9.99/mo; sign USPS Form 1583 (can be done by video notary). Mail is scanned and you view it online. A P.O. box alone is <b>NOT</b> enough for SAM.gov — it needs a physical street address. Bank: bring the filed certificate, EIN letter, passport, and operating agreement; the bank does its own checks and this is usually the slowest step (days to weeks). 🔗 <a href="https://www.anytimemailbox.com/" target="_blank">Anytime Mailbox</a> · <a href="https://ipostal1.com/" target="_blank">iPostal1</a> · <a href="https://sam.gov/" target="_blank">SAM.gov</a></div></details></div></div><div style="margin-top:8px;font-size:12px">✅ <b>Done = you can bid as a US prime.</b> Without this: no EIN, no SAM.gov, no US bank account. A US company does <b>not</b> by itself make foreign-made goods “US-made”. Fees change — check the state SOS site.</div>',
